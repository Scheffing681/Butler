/* Standalone (internet) version: the host runtime is absent. Only file downloads get a browser fallback;

if(!window.bhost){window.bhost={__standalone:1,use:async n=>n==='downloads'?{save:async({filename,data})=>{
  const ty=/\.json$/i.test(filename)?'application/json':/\.pdf$/i.test(filename)?'application/pdf':/\.(vcf)$/i.test(filename)?'text/vcard':/\.(html?)$/i.test(filename)?'text/html':/\.(txt|md)$/i.test(filename)?'text/plain':'application/octet-stream';
  const b=data instanceof Blob?data:new Blob([data],{type:ty}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000)}}:null}}
</script>

  function show(){var d=document.createElement('div');d.id='btgate';d.innerHTML='<style>#btgate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 50% 30%,#123a28,#06130c);font-family:Georgia,serif;color:#efe3c2}#btgate .b{width:100%;max-width:340px;text-align:center;padding:34px 24px;border-radius:22px;border:1px solid rgba(201,165,94,.55);background:rgba(10,33,22,.9)}#btgate h1{font-weight:400;font-size:30px;letter-spacing:.2em;margin:0 0 6px;color:#f1d78f}#btgate p{margin:0 0 18px;opacity:.75;font-size:15px}#btgate input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid rgba(201,165,94,.55);background:#06150e;color:#f1e6c8;font-size:18px;text-align:center;outline:none}#btgate button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#e6c77a,#b8913a);color:#10261c;font:600 17px Georgia,serif}#btgate .sh{animation:bts .45s}@keyframes bts{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}</style><div class="b"><h1>BUTLER</h1><p>Private · Privat · Частный доступ</p><input type="password" autocomplete="off" autocapitalize="off" placeholder="•••"><button type="button">→</button></div>';document.body.appendChild(d);
   var i=d.querySelector('input'),b=d.querySelector('.b');function tryIt(){var v=String(i.value||'').trim().toLowerCase();if(!v||!crypto.subtle)return;crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(h){var x=Array.from(new Uint8Array(h)).map(function(n){return n.toString(16).padStart(2,'0')}).join('');if(x==='78bc5f9d95110b29ec584baef6b60eba8a2789ef7a1459b8abd7ea7e40ca2611'){try{localStorage.setItem('bt-ok','1')}catch(e){}d.remove();go()}else{b.classList.remove('sh');void b.offsetWidth;b.classList.add('sh');i.select()}})}
