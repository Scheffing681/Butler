<style>html,body{margin:0;height:100%;background:#07140e;color:#efe3c2;font-family:'EB Garamond',Georgia,'Times New Roman',serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 90% at 50% 35%,#123a28 0%,#0a2116 55%,#050d09 100%)}
#bkw{display:none;height:100%}#bk{display:block;touch-action:none}
#bot{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.18em;color:#c9a55e;opacity:.85}
#hint{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:rgba(10,33,22,.92);border:1px solid rgba(201,165,94,.5);border-radius:999px;padding:9px 16px;font-size:14px;white-space:nowrap;opacity:0;transition:.6s;pointer-events:none}#hint.on{opacity:1;transform:translate(-50%,0)}
.card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px;text-align:center;padding:34px 26px;border-radius:22px;background:linear-gradient(180deg,#123a28,#0b2418);border:1px solid rgba(201,165,94,.55);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 6px rgba(201,165,94,.08)}
.seal{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24a3c,#8e1c16 60%,#5e0f0b);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.35);display:grid;place-items:center;font-size:28px;color:#f3c9a8}
.box h1{font-weight:400;font-size:21px;line-height:1.35;margin:0 0 6px;color:#f1d78f}.box p{min-height:20px;margin:8px 0 0;font-size:15px;color:#e8a0a0}
#pwi{width:100%;box-sizing:border-box;margin-top:16px;padding:14px;border-radius:12px;border:1px solid rgba(201,165,94,.55);background:#06150e;color:#f1e6c8;font-size:18px;text-align:center;letter-spacing:.08em;outline:none;-webkit-user-select:text;user-select:text}
#pwb{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#e6c77a,#b8913a);color:#10261c;font:600 17px Georgia,serif}
.shake{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#wait .box{background:none;border:0;box-shadow:none}#wait .seal{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{transform:scale(.9);opacity:.75}}</style></head><body>
